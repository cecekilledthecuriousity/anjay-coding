<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <path id="completed-top-arc" d="M 45 150 A 105 105 0 0 1 255 150" fill="none" />
    <filter id="ink-bleed-1" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#ink-bleed-1)">
    <!-- Outer dashed border -->
    <circle cx="150" cy="150" r="140" fill="none" stroke="#225d2a" stroke-width="3" stroke-dasharray="7 4" />
    <!-- Outer solid thin line -->
    <circle cx="150" cy="150" r="133" fill="none" stroke="#225d2a" stroke-width="1.2" />
    <!-- Inner solid main ring -->
    <circle cx="150" cy="150" r="118" fill="none" stroke="#225d2a" stroke-width="2.5" />
    
    <!-- Curved Header Text: TDS LEARNING PASSPORT -->
    <text fill="#225d2a" font-family="'Inter', 'Arial Black', -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="3.5">
      <textPath href="#completed-top-arc" startOffset="50%" text-anchor="middle">
        ★ TDS LEARNING PASSPORT ★
      </textPath>
    </text>

    <!-- Center Graduation Cap & Tassel Icon -->
    <g transform="translate(150, 92)" stroke="#225d2a" fill="#225d2a">
      <polygon points="0,-16 38,0 0,14 -38,0" fill="#225d2a" fill-opacity="0.12" stroke-width="2.2" stroke-linejoin="round" />
      <path d="M -20,5 Q 0,16 20,5 L 20,13 Q 0,22 -20,13 Z" fill="#225d2a" fill-opacity="0.25" stroke-width="1.8" />
      <circle cx="0" cy="-1" r="2.5" fill="#225d2a" stroke="none" />
      <path d="M 0,-1 Q 26,4 32,15" fill="none" stroke-width="1.8" stroke-linecap="round" />
      <polygon points="30,14 34,14 35,24 29,24" fill="#225d2a" stroke="none" />
    </g>

    <!-- Middle Banner -->
    <g transform="translate(150, 138)">
      <rect x="-95" y="-13" width="190" height="26" rx="2" fill="#225d2a" fill-opacity="0.1" stroke="#225d2a" stroke-width="2" />
      <line x1="-95" y1="-13" x2="-95" y2="13" stroke="#225d2a" stroke-width="3" />
      <line x1="95" y1="-13" x2="95" y2="13" stroke="#225d2a" stroke-width="3" />
      <text x="0" y="5.5" text-anchor="middle" fill="#225d2a" font-family="'Inter', 'Arial Black', -apple-system, sans-serif" font-size="14.5" font-weight="900" letter-spacing="3.5" stroke="none">
        COMPLETED
      </text>
    </g>

    <!-- Sub-heading under banner -->
    <text x="150" y="164" text-anchor="middle" fill="#225d2a" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" letter-spacing="2.5">
      SKILLS ATTESTATION
    </text>

    <!-- Clean Dynamic Date & Hours Clearance Area -->
    <g transform="translate(150, 200)">
      <line x1="-65" y1="-18" x2="65" y2="-18" stroke="#225d2a" stroke-width="1.2" stroke-dasharray="4 2" />
      <circle cx="-68" cy="-18" r="1.8" fill="#225d2a" stroke="none" />
      <circle cx="68" cy="-18" r="1.8" fill="#225d2a" stroke="none" />
      
      <line x1="-65" y1="18" x2="65" y2="18" stroke="#225d2a" stroke-width="1.2" stroke-dasharray="4 2" />
      <circle cx="-68" cy="18" r="1.8" fill="#225d2a" stroke="none" />
      <circle cx="68" cy="18" r="1.8" fill="#225d2a" stroke="none" />
    </g>

    <!-- Bottom Rim Text -->
    <text x="150" y="230" text-anchor="middle" fill="#225d2a" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" letter-spacing="2">
      ★ VERIFIED TRAINING RECORD ★
    </text>
  </g>
</svg>