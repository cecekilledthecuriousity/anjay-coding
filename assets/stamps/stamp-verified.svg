<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="ink-bleed-2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#ink-bleed-2)">
    <!-- Outer Octagon -->
    <polygon points="90,14 210,14 286,90 286,210 210,286 90,286 14,210 14,90" 
      fill="none" stroke="#0f3c8a" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Inner Octagon Line -->
    <polygon points="94,22 206,22 278,94 278,206 206,278 94,278 22,206 22,94" 
      fill="none" stroke="#0f3c8a" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Top Passport Header: SKILL VALIDATION (No Immigration) -->
    <g transform="translate(150, 52)">
      <text x="0" y="0" text-anchor="middle" fill="#0f3c8a" font-family="'Inter', 'Arial Black', sans-serif" font-size="9.5" font-weight="900" letter-spacing="2.5">
        SKILL VALIDATION
      </text>
      <line x1="-70" y1="8" x2="70" y2="8" stroke="#0f3c8a" stroke-width="1" />
      <polygon points="-78.0,4.0 -77.3,6.0 -75.1,6.1 -76.8,7.4 -76.2,9.4 -78.0,8.3 -79.8,9.4 -79.2,7.4 -80.9,6.1 -78.7,6.0" fill="#0f3c8a" />
      <polygon points="78.0,4.0 78.7,6.0 80.9,6.1 79.2,7.4 79.8,9.4 78.0,8.3 76.2,9.4 76.8,7.4 75.1,6.1 77.3,6.0" fill="#0f3c8a" />
    </g>

    <!-- Center Security Shield with Checkmark Icon -->
    <g transform="translate(150, 96)">
      <path d="M 0,-22 L 23,-11 C 23,10 13,25 0,31 C -13,25 -23,10 -23,-11 Z" 
        fill="#0f3c8a" fill-opacity="0.1" stroke="#0f3c8a" stroke-width="2.2" stroke-linejoin="round" />
      <polyline points="-11,3 -3,12 13,-6" fill="none" stroke="#0f3c8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title Banner -->
    <g transform="translate(150, 146)">
      <rect x="-92" y="-13" width="184" height="26" rx="2" fill="#0f3c8a" fill-opacity="0.12" stroke="#0f3c8a" stroke-width="2" />
      <text x="0" y="5.5" text-anchor="middle" fill="#0f3c8a" font-family="'Inter', 'Arial Black', sans-serif" font-size="15" font-weight="900" letter-spacing="3.5">
        TDS VERIFIED
      </text>
    </g>

    <!-- Subtext: COMPETENCY: VERIFIED (No Security Clearance) -->
    <text x="150" y="172" text-anchor="middle" fill="#0f3c8a" font-family="sans-serif" font-size="8" font-weight="800" letter-spacing="2">
      COMPETENCY: VERIFIED
    </text>

    <!-- Clean Dynamic Date/Hours Area -->
    <g transform="translate(150, 206)">
      <line x1="-66" y1="-16" x2="66" y2="-16" stroke="#0f3c8a" stroke-width="1.2" stroke-dasharray="4 2" />
      <line x1="-66" y1="18" x2="66" y2="18" stroke="#0f3c8a" stroke-width="1.2" stroke-dasharray="4 2" />
    </g>

    <!-- Bottom Edge Stamp Code: TALENT DEVELOPMENT SYSTEM (No Border Control) -->
    <text x="150" y="244" text-anchor="middle" fill="#0f3c8a" font-family="'Inter', monospace" font-size="7.5" font-weight="800" letter-spacing="2">
      ★ TALENT &amp; DEVELOPMENT ★
    </text>
  </g>
</svg>