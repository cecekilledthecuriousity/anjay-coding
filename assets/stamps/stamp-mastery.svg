    <g transform="translate(150, 96)">
      <polygon points="-30.0,-2.0 -28.3,2.6 -23.3,2.8 -27.2,5.9 -25.9,10.7 -30.0,7.9 -34.1,10.7 -32.8,5.9 -36.7,2.8 -31.7,2.6" fill="#2b394a" />
      <polygon points="0.0,-13.0 2.5,-6.4 9.5,-6.1 4.0,-1.7 5.9,5.1 0.0,1.2 -5.9,5.1 -4.0,-1.7 -9.5,-6.1 -2.5,-6.4" fill="#2b394a" />
