<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <path id="achieve-top-arc" d="M 50 120 A 100 100 0 0 1 250 120" fill="none" />
    <filter id="ink-bleed-4" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#ink-bleed-4)">
    <!-- Outer Arch Gate -->
    <path d="M 22,274 L 22,126 A 128 128 0 0 1 278,126 L 278,274 Z" 
      fill="none" stroke="#621b96" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Inner Arch Gate Line -->
    <path d="M 32,266 L 32,128 A 118 118 0 0 1 268,128 L 268,266 Z" 
      fill="none" stroke="#621b96" stroke-width="1.2" stroke-dasharray="5 3" />
    <!-- Core Boundary Line -->
    <path d="M 40,258 L 40,132 A 110 110 0 0 1 260,132 L 260,258 Z" 
      fill="none" stroke="#621b96" stroke-width="2" />

    <!-- Top Dome Curved Text -->
    <text fill="#621b96" font-family="'Inter', 'Arial Black', sans-serif" font-size="11.5" font-weight="900" letter-spacing="3.5">
      <textPath href="#achieve-top-arc" startOffset="50%" text-anchor="middle">
        ★ EXCELLENCE AWARD ★
      </textPath>
    </text>

    <!-- Center Trophy Cup -->
    <g transform="translate(150, 98)">
      <path d="M -16,-16 L 16,-16 C 16,3 8,13 0,15 C -8,13 -16,3 -16,-16 Z" 
        fill="#621b96" fill-opacity="0.15" stroke="#621b96" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M -16,-10 C -25,-10 -25,2 -13,2" fill="none" stroke="#621b96" stroke-width="1.6" />
      <path d="M 16,-10 C 25,-10 25,2 13,2" fill="none" stroke="#621b96" stroke-width="1.6" />
      <line x1="0" y1="15" x2="0" y2="22" stroke="#621b96" stroke-width="2" />
      <line x1="-11" y1="22" x2="11" y2="22" stroke="#621b96" stroke-width="2.2" stroke-linecap="round" />
      <polygon points="0.0,-7.5 1.1,-4.5 4.3,-4.4 1.8,-2.4 2.6,0.6 0.0,-1.1 -2.6,0.6 -1.8,-2.4 -4.3,-4.4 -1.1,-4.5" fill="#621b96" />
    </g>

    <!-- Title Banner: DISTINCTION -->
    <g transform="translate(150, 142)">
      <rect x="-92" y="-12" width="184" height="24" rx="2" fill="#621b96" fill-opacity="0.12" stroke="#621b96" stroke-width="1.8" />
      <text x="0" y="5" text-anchor="middle" fill="#621b96" font-family="'Inter', 'Arial Black', sans-serif" font-size="12.2" font-weight="900" letter-spacing="2">
        DISTINCTION ENTRY
      </text>
    </g>

    <!-- Subtext: OUTSTANDING ACHIEVEMENT (No Pass) -->
    <text x="150" y="166" text-anchor="middle" fill="#621b96" font-family="sans-serif" font-size="8" font-weight="800" letter-spacing="2">
      OUTSTANDING ACHIEVEMENT
    </text>

    <!-- Clean Dynamic Date/Hours Area -->
    <g transform="translate(150, 204)">
      <line x1="-66" y1="-16" x2="66" y2="-16" stroke="#621b96" stroke-width="1.2" stroke-dasharray="4 2" />
      <line x1="-66" y1="18" x2="66" y2="18" stroke="#621b96" stroke-width="1.2" stroke-dasharray="4 2" />
    </g>

    <!-- Bottom Footer -->
    <text x="150" y="244" text-anchor="middle" fill="#621b96" font-family="'Inter', sans-serif" font-size="8" font-weight="800" letter-spacing="2">
      ★ TDS ACADEMY HONORS ★
    </text>
  </g>
</svg>