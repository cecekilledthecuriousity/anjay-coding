<div class="sticky-bottom-bar" id="stickyBottomBar">
  <div class="bottom-bar-inner">
    <div class="bottom-bar-info">
      <span id="bottomStepIndicator">Langkah 1 dari 2: Profil &amp; Sasaran</span>
    </div>
    <div class="bottom-bar-actions">
      <button type="button" class="btn-secondary" id="prevStepBtn" onclick="prevStep()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Kembali
      </button>
      <button type="button" class="btn-primary" id="nextStepBtn" onclick="nextStep()">
        Lanjutkan
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <button type="button" class="btn-primary" id="submitBtn" onclick="submitPlan()" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        Preview &amp; Kirim
      </button>
    </div>
  </div>
</div>
