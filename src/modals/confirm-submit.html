<div class="modal-overlay" id="modalConfirmSubmit">
  <div class="modal-card" style="max-width:680px;">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="card-icon-wrap" style="width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-tint);color:var(--ink);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        </div>
        <div>
          <h3 class="voice" style="margin:0;font-size:16px;">Ringkasan Pengajuan (Preview)</h3>
          <span style="font-size:12px;color:var(--ink-soft);">Periksa kembali sebelum mengirim</span>
        </div>
      </div>
      <button type="button" class="modal-close" onclick="closeModal('modalConfirmSubmit')">&times;</button>
    </div>
    <div class="modal-body" style="padding-top:14px;">
      <p style="margin:0 0 12px;font-size:13px;color:var(--ink-soft);">Pastikan seluruh rincian formulir training di bawah ini sudah benar sebelum diajukan ke sistem:</p>

      <div class="review-box" style="margin-bottom:14px;">
        <div class="review-grid">
          <div class="review-item"><label>ID Training</label><div id="revId">-</div></div>
          <div class="review-item"><label>Jenis Training</label><div id="revJenis">-</div></div>
          <div class="review-item"><label>Nama Training</label><div id="revName">-</div></div>
          <div class="review-item"><label>Nama Pengaju</label><div id="revLeader">-</div></div>
          <div class="review-item"><label>Departemen / Divisi</label><div id="revDept">-</div></div>
          <div class="review-item"><label>Kategori / Level</label><div id="revCategory">-</div></div>
          <div class="review-item"><label>Kebutuhan (Urgensi)</label><div id="revNeed">-</div></div>
          <div class="review-item"><label>Metode &amp; Jadwal</label><div id="revSchedule">-</div></div>
          <div class="review-item"><label>Lokasi / Platform</label><div id="revVenue">-</div></div>
          <div class="review-item"><label>Trainer</label><div id="revTrainer">-</div></div>
          <div class="review-item"><label>Durasi &amp; Partisipan</label><div id="revDurationParticipants">-</div></div>
          <div class="review-item"><label>Waktu &amp; PIC Evaluasi</label><div id="revEvaluasi">-</div></div>
        </div>
        <div id="revGoalsWrapper" style="display:none;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;">
          <label style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:3px;">Training Goals (Tujuan &amp; Hasil)</label>
          <div id="revGoals" style="color:var(--ink);line-height:1.5;">-</div>
        </div>
        <div class="review-divider"></div>
        <div style="font-size:12px;color:var(--ink-faint);line-height:1.5;">
          Detail lengkap (seluruh baris peserta dan modul) akan tersimpan di Google Spreadsheet dan master data.
        </div>
      </div>
    </div>
    <div class="modal-footer" style="display:flex;justify-content:space-between;align-items:center;">
      <button type="button" class="btn-secondary" onclick="closeModal('modalConfirmSubmit')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        Periksa Kembali
      </button>
      <button type="button" class="btn-primary" onclick="confirmAndExecuteSubmit()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        Ya, Kirim Pengajuan
      </button>
    </div>
  </div>
</div>
