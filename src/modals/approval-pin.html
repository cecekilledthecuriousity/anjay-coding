<div class="modal-overlay" id="modalApprovalPin">
  <div class="modal-card" style="max-width:400px;">
    <div class="modal-header">
      <h3 class="voice">Portal Approval (Terkunci)</h3>
      <button type="button" class="modal-close" onclick="cancelApprovalPin()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-icon-badge info">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <p>Portal Approval khusus untuk Leader/Approver dan HR Management. Masukkan PIN untuk verifikasi akses:</p>
      <form onsubmit="event.preventDefault(); verifyAndOpenApproval();" style="margin-top:12px;">
        <input type="password" id="approvalGatePinInput" class="field" placeholder="PIN Akses Approval" style="padding:10px 12px;border:1px solid var(--line);border-radius:8px;width:100%;font-size:14px;" autocomplete="current-password">
        <div id="approvalGatePinError" style="display:none;color:#b91c1c;font-size:12px;margin-top:6px;font-weight:500;"></div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-secondary" onclick="cancelApprovalPin()">Batal</button>
      <button type="button" class="btn-primary" onclick="verifyAndOpenApproval()">Buka Portal</button>
    </div>
  </div>
</div>
