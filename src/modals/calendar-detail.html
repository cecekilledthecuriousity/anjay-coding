<div class="modal-overlay" id="modalTrainingEventDetail">
  <div class="modal-card" style="max-width:540px;">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="card-icon-wrap" style="width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-tint);color:var(--ink);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <div>
          <h3 class="voice" style="margin:0;font-size:16px;">Detail Jadwal Training</h3>
          <span style="font-size:12px;color:var(--ink-soft);">Informasi lengkap sesi pelaksanaan</span>
        </div>
      </div>
      <button type="button" class="modal-close" onclick="closeModal('modalTrainingEventDetail')">&times;</button>
    </div>
    <div class="modal-body" style="padding-top:14px;">
      <div style="margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span class="mini-pill" id="calDetailStatusBadge" style="font-size:11px;padding:2px 8px;">Status</span>
          <span id="calDetailId" style="font-family:monospace;font-size:12px;color:var(--ink-faint);font-weight:600;">TRN-XXXX</span>
        </div>
        <h4 id="calDetailJudul" class="voice" style="font-size:18px;margin:0 0 6px;color:var(--ink);line-height:1.3;">-</h4>
        <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);">
          <span id="calDetailKategori" class="mini-pill" style="background:rgba(0,0,0,0.05);color:var(--ink);font-size:11.5px;padding:2px 8px;">Soft skill</span>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--panel-strong);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;">
        <div>
          <div style="font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.03em;font-weight:600;margin-bottom:2px;">Waktu &amp; Tanggal</div>
          <div id="calDetailWaktu" style="font-size:13px;font-weight:600;color:var(--ink);">-</div>
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.03em;font-weight:600;margin-bottom:2px;">Ruangan / Lokasi</div>
          <div id="calDetailRuangan" style="font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;">
            <span id="calDetailRoomDot" style="width:8px;height:8px;border-radius:50%;display:inline-block;background:#2563EB;"></span>
            <span id="calDetailRoomName">-</span>
          </div>
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.03em;font-weight:600;margin-bottom:2px;">Pemohon (Leader)</div>
          <div id="calDetailPemohon" style="font-size:13px;font-weight:600;color:var(--ink);">-</div>
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.03em;font-weight:600;margin-bottom:2px;">Divisi / Dept</div>
          <div id="calDetailDivisi" style="font-size:13px;font-weight:600;color:var(--ink);">-</div>
        </div>
      </div>

      <div id="calDetailExtraWrap" style="font-size:12.5px;color:var(--ink-soft);background:rgba(0,0,0,0.02);border:1px dashed var(--line-soft);border-radius:8px;padding:10px 12px;line-height:1.5;">
        <span style="font-weight:600;color:var(--ink);">Keterangan:</span>
        <span id="calDetailExtra">-</span>
      </div>
    </div>
    <div class="modal-footer" style="display:flex;justify-content:flex-end;">
      <button type="button" class="btn-secondary" onclick="closeModal('modalTrainingEventDetail')">Tutup</button>
    </div>
  </div>
</div>
